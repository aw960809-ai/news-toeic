name: Deploy standalone app to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Validate standalone app
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f app.js
          python -m json.tool manifest.webmanifest >/dev/null
          git diff --check
      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          shopt -s dotglob
          for item in *; do
            case "$item" in
              .git|.github|_site) ;;
              *) cp -R "$item" _site/ ;;
            esac
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

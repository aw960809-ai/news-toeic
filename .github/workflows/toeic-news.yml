name: TOEIC GitHub News Refresh
on:
  schedule:
    - cron: '20 21,3,9,15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: toeic-github-news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch and validate RSS
        run: |
          python tools/toeic_news_refresh.py
          python -m json.tool data/news.json > /dev/null
          git diff --check
      - name: Persist snapshot
        run: |
          if git diff --quiet -- data/news.json; then exit 0; fi
          git config user.name 'toeic-news-refresh[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          git commit -m "chore(toeic): refresh news ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main

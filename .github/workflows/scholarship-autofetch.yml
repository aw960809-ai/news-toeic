name: THU Scholarship AutoFetch Manual Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check only
        run: |
          python -m py_compile tools/autofetch/scholarship_autofetch.py tools/autofetch/lifecycle_archive.py
          python tools/autofetch/scholarship_autofetch.py --repo . --check
          git diff --exit-code -- data/scholarships.json
          echo "SCHOLARSHIP_DIAGNOSTIC_OK"
